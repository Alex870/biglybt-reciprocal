name: Build

on:
  push:
    branches: ['**']
  pull_request:
  # Publishing a release on GitHub (Releases -> Draft a new release -> Publish)
  # builds the jar and attaches it to that release.
  release:
    types: [published]

permissions:
  contents: write   # needed to attach the jar to the release

env:
  # BiglyBT version whose API the plugin is compiled against.
  BIGLYBT_REF: v4.1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: BiglySoftware/BiglyBT
          ref: ${{ env.BIGLYBT_REF }}
          path: .biglybt-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build BiglyBT API jar
        run: scripts/build-biglybt-jar.sh .biglybt-src

      - name: Check release tag matches version
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          if [[ "$GITHUB_EVENT_NAME" == release ]]; then
            name="${GITHUB_REF_NAME#v}"
            # The release tag must be the version in gradle.properties, optionally with a -suffix.
            if [[ "$name" != "$version" && "$name" != "$version"-* ]]; then
              echo "::error::Release tag $GITHUB_REF_NAME does not match pluginVersion=$version in gradle.properties"
              exit 1
            fi
          fi

      - name: Build and test
        run: ./gradlew build --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: reciprocal-jar
          path: build/libs/*.jar

      - name: Attach jar to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$GITHUB_REF_NAME" build/libs/*.jar --clobber --repo "$GITHUB_REPOSITORY"
