name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: write   # needed to attach the jar to a GitHub Release on tags

env:
  # BiglyBT version whose API the plugin is compiled against.
  BIGLYBT_REF: v4.1.0.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: BiglySoftware/BiglyBT
          ref: ${{ env.BIGLYBT_REF }}
          path: .biglybt-src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build BiglyBT API jar
        run: scripts/build-biglybt-jar.sh .biglybt-src

      - name: Work out release name
        id: release
        run: |
          version=$(sed -n 's/^pluginVersion=//p' gradle.properties)
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            name="${GITHUB_REF_NAME#v}"
            # The tag must be the version in gradle.properties, optionally with a -suffix.
            if [[ "$name" != "$version" && "$name" != "$version"-* ]]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match pluginVersion=$version in gradle.properties"
              exit 1
            fi
          else
            name="$version"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: ./gradlew build --no-daemon -PreleaseName=${{ steps.release.outputs.name }}

      - uses: actions/upload-artifact@v4
        with:
          name: reciprocal-jar
          path: build/libs/*.jar

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
          # Tags with a suffix (v0.4.0-beta1) are published as pre-releases, not "Latest".
          prerelease: ${{ contains(github.ref_name, '-') }}
