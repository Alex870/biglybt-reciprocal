# Single source of truth for the plugin version (filtered into plugin.properties).
pluginVersion=0.3.0

# Path to a BiglyBT.jar to compile against. Override on the command line with
#   -PbiglybtJar=/path/to/BiglyBT.jar
# or set it in ~/.gradle/gradle.properties. The jar is not redistributed.
biglybtJar=libs/BiglyBT.jar
